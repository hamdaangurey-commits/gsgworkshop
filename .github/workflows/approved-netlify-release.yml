name: GSG approved Netlify release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type ACCEPT to authorize one production deploy"
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Validate, approve, and deploy
    if: ${{ inputs.approval == 'ACCEPT' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate application JavaScript
        run: node --check app.js

      - name: Validate Update Center inline JavaScript
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('update-center.html','utf8');const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];if(!scripts.length)throw new Error('No inline script found');fs.writeFileSync('/tmp/update-center-inline.js',scripts[scripts.length-1][1]);"
          node --check /tmp/update-center-inline.js

      - name: Confirm finance data protection markers
        run: |
          grep -q "hamdan_os_v1" app.js
          grep -q "hamdan_os_session" app.js

      - name: Check Netlify deploy hook is configured
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::Add NETLIFY_BUILD_HOOK as a GitHub Actions secret before releasing."
            exit 1
          fi

      - name: Trigger one Netlify production build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK"
