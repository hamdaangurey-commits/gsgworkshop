name: GSG quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application JavaScript syntax
        run: node --check app.js

      - name: Check Update Center inline JavaScript
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('update-center.html','utf8');const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];if(!scripts.length)throw new Error('No inline script found');fs.writeFileSync('/tmp/update-center-inline.js',scripts[scripts.length-1][1]);"
          node --check /tmp/update-center-inline.js

      - name: Verify finance data key and navigation remain present
        run: |
          grep -q "hamdan_os_v1" app.js
          grep -q "hamdan_os_session" app.js
          grep -q 'href="update-center.html"' index.html
          grep -q "hamdan_os_v1" update-center.html

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
